OPENAI_API_KEY: sk-local
base_url: http://localhost:1234/v1
history_file: chat_history.json
llm_provider: openai
model: hermes-local
opencode:
  agent: voice-chat
  command: opencode
  model: opencode/big-pickle
  timeout: 180
presets:
  default:
    system_prompt: 'You are a helpful, neutral AI assistant.

      You provide clear, accurate, and concise answers.

      '
sovits_ping_config:
  prompt_lang: en
  prompt_text: This is a sample voice for the text to speech synthesis.
  ref_audio_path: character_files/main_sample.wav
  text_lang: en
